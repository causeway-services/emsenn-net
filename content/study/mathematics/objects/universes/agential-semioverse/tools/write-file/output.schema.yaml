$schema: "http://json-schema.org/draft-07/schema#"
type: object
properties:
  path:
    type: string
  changed:
    type: boolean
  previous_exists:
    type: boolean
  dry_run:
    type: boolean
  bytes_written:
    type: integer
  hash:
    type: string
  effect_report:
    type: object
required:
  - path
  - changed
  - previous_exists
  - dry_run
  - bytes_written
  - effect_report
additionalProperties: true
